apiVersion: v1
kind: Secret
metadata:
  name: boutique-secrets
  namespace: boutique
type: Opaque
stringData:
  POSTGRES_DB: "<DATABASE_NAME>"
  POSTGRES_USER: "<DATABASE_USER>"
  POSTGRES_PASSWORD: "<REPLACE_WITH_SECRET>"
  AUTH_DB_URL: "<REPLACE_WITH_DATABASE_URL>"
  PRODUCTS_DB_URL: "<REPLACE_WITH_DATABASE_URL>"
  ORDERS_DB_URL: "<REPLACE_WITH_DATABASE_URL>"
  USERS_DB_URL: "<REPLACE_WITH_DATABASE_URL>"